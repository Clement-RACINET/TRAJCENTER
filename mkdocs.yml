site_name: TrajCenter
theme:
  name: readthedocs
  logo: assets/logo.png
  favicon: assets/favicon.png

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
  - coverage:
      html_report_dir: docs/coverage  # le rapport HTML

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]

nav:
  - Accueil: index.md
  - Référence API:
    # --- AUTOGEN_API_START ---
    - Trajcenter:
      - Cli:
        - Main: api/trajcenter/cli/main.md
      - Convert:
        - Apt Converter: api/trajcenter/convert/apt_converter.md
        - Base: api/trajcenter/convert/base.md
        - Column Mapper: api/trajcenter/convert/column_mapper.md
        - Csv Converter: api/trajcenter/convert/csv_converter.md
        - Defaults: api/trajcenter/convert/defaults.md
        - Excel Converter: api/trajcenter/convert/excel_converter.md
        - Mod Converter: api/trajcenter/convert/mod_converter.md
        - Tabular Converter: api/trajcenter/convert/tabular_converter.md
      - Core:
        - Logger: api/trajcenter/core/logger.md
        - Messages: api/trajcenter/core/messages.md
        - Trajectory: api/trajcenter/core/trajectory.md
      - Export:
        - Base: api/trajcenter/export/base.md
        - Csv Exporter: api/trajcenter/export/csv_exporter.md
        - Excel Exporter: api/trajcenter/export/excel_exporter.md
        - Options: api/trajcenter/export/options.md
        - Tabular Exporter: api/trajcenter/export/tabular_exporter.md
      - Robot:
        - Utils: api/trajcenter/robot/_utils.md
        - Constants: api/trajcenter/robot/constants.md
        - Models: api/trajcenter/robot/models.md
        - Reader: api/trajcenter/robot/reader.md
        - Resolver: api/trajcenter/robot/resolver.md
        - Service: api/trajcenter/robot/service.md
        - Store: api/trajcenter/robot/store.md
        - Supervisor: api/trajcenter/robot/supervisor.md
        - Writer: api/trajcenter/robot/writer.md
        - Errors:
          - Base: api/trajcenter/robot/errors/base.md
          - Codes: api/trajcenter/robot/errors/codes.md
          - Translate: api/trajcenter/robot/errors/translate.md
# --- AUTOGEN_API_END ---
  - Coverage: coverage.md 

