[project]
name = "trajcenter"
requires-python = ">=3.11"
version = "2.1.0"
dependencies = [
    "pydantic>=2",
    "pandas>=3.0.3,<4",
    "numpy>=2.5.1,<3",
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
robot = [
    "httpx>=0.28.1,<0.29",
    "abb_rws_client_python_rw6 @ git+https://gitlab.com/robothub/abb-rws-client-python-rw6.git@main",
]

cli = [
    "rich>=15.0.0,<16",
]

tui = [
    "rich>=15.0.0,<16",
]

textual = [
    "rich>=15.0.0,<16",
    "textual>=8.2.8,<9",
]

docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.6,<10",
    "mkdocstrings[python]>=1.0.4,<2",
    "mkdocs-coverage>=2.0.0,<3",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx",
    "ruff",
    "mypy",
    "pre-commit",
]

all = [
    "trajcenter[robot,cli,tui,textual,docs,dev]",
]

[project.scripts]
trajcenter = "trajcenter.cli.main:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.basedpyright]
pythonVersion          = "3.11"
pythonPlatform         = "Windows"
venvPath               = ".pixi/envs"
venv                   = "dev"
typeCheckingMode       = "basic"
include                = ["trajcenter"]
exclude                = ["test.py", "tests/"]
useLibraryCodeForTypes = true
reportUnknownMemberType   = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs    = "warning"
reportAny                 = "none"
reportCallIssue           = "none"

[tool.pytest.ini_options]
asyncio_mode                       = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=trajcenter",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:docs/coverage",
    "--cov-report=xml:coverage.xml",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["trajcenter", "tests"]
branch = true
omit   = [".pixi/*", "*/site-packages/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "docs/coverage"
title     = "TrajCenter — Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.py-init-tools]
package_roots = ["trajcenter"]
test_roots = ["tests"]

package_version = "2.1.0"
package_description = "TrajCenter v2 — trajectory management and RWS transfer for ABB robots."

generated_marker = "Generated by py-init-tools"

generate_root_reexports = true

reexport_allowlist = [
  "core",
  "convert",
  "export",
  "store",
]

discovery_mode = "all_public"
export_constants = true
export_type_aliases = true
flat_subdirs = []

[tool.py-structure-tools]
exclude_dirs = [
    "docs",
    "site",
    "outputs",
    "data",
    "sandbox",
]

exclude_files = [
    "*.log",
    "*.tmp",
    "*.bak",
    "*.csv",
    "*.parquet",
]

include_hidden = false
use_gitignore = true
max_depth = 5
default_formats = ["txt", "html"]
output_basename = "trajcenter_structure"


# =============================================================================
# py-doc-tools
# =============================================================================

[tool.py-doc-tools]
docs_dir = "docs"
docs_src_dir = "docs/src"
mkdocs_config = "mkdocs.yml"
packages = ["trajcenter"]

enable_api = true
enable_examples = false
enable_coverage = false
enable_readme = true
enable_todo = false
enable_diagnostics = false
enable_tags = false
enable_diagrams = false

use_emojis = true
console_emojis = false
verbose = true


# -----------------------------------------------------------------------------
# API documentation
# -----------------------------------------------------------------------------

[tool.py-doc-tools.api]
output_dir = "docs/src/api"
nav_start_marker = "# --- AUTOGEN_API_START ---"
nav_end_marker = "# --- AUTOGEN_API_END ---"

clean_output_dir = true

overview_enabled = false

folder_intro_enabled = true
folder_intro_filename = "__doc__.md"
module_pre_suffix = ".pre.md"
module_post_suffix = ".post.md"

exclude_dirs = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".pixi",
    ".vscode",
    ".git",
    ".hg",
    ".svn",
    ".venv",
    "venv",
    "site-packages",
    "docs",
    "docs/build",
    "site",
    "build",
    "dist",
    "outputs",
    "data",
    "sandbox",
    "trajectory_files",
    "trajectory_exports",
    "trajectory_store",
    "doc_manual",
    "icons",
    "rapid",
]

exclude_files = [
    "__init__.py",
    "*.pyc",
    "*.pyo",
    "*.json",
]

# -----------------------------------------------------------------------------
# README documentation
# -----------------------------------------------------------------------------

[tool.py-doc-tools.readme]
source_file = "README.md"
output_file = "docs/src/readme.md"
title = "README"
include_toc_note = true
