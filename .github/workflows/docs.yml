name: Deploy Documentation

on:
  push:
    branches:
      - main
      - v2

# Déclare les permissions requises pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
          cache: true
          environments: dev

      - name: Générer la documentation
        run: pixi run -e dev docs

      - name: Construire le site MkDocs
        run: pixi run -e dev docs-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public # Dossier par défaut généré par mkdocs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
