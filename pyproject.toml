[project]
name = "trajcenter"
requires-python = ">=3.11"
version = "2.1.0"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pandas>=3.0.3,<4",
    "numpy>=2.5.1,<3",
    "pydantic>=2",
    "openpyxl>=3.1.5,<4",
    "rich>=15.0.0,<16",
    "typer>=0.26.8,<0.27",
    "textual>=8.2.8,<9",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
trajcenter = { path = ".", editable = true }
abb_rws_client_python_rw6 = { git = "https://github.com/Clement-RACINET/abb-rws-client-python-rw6.git", branch = "main" }

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }
docs    = { features = ["docs"], solve-group = "default" }


# ── Tâches disponibles UNIQUEMENT dans l'environnement dev ───────────────────
[tool.pixi.feature.dev.tasks]
tests      = "pytest tests/"
lint      = "ruff check trajcenter/"
fmt       = "ruff format trajcenter/"
typecheck = "mypy trajcenter/"

# ── Tâches disponibles UNIQUEMENT dans l'environnement docs ──────────────────
[tool.pixi.feature.docs.tasks]
docs       = "python scripts/doc/run_docs.py"
docs-build = "python -m mkdocs build --strict"
docs-serve = "python -m mkdocs serve"

[tool.pixi.dependencies]
python            = ">=3.12,<3.13"
pyarrow           = ">=24.0.0,<25"
pandas-stubs      = ">=3.0.3.260530,<4"
typing_extensions = ">=4.16.0,<5"
pytest = ">=9.1.1,<10"

[tool.pixi.feature.dev.pypi-dependencies]
pytest         = ">=8"
pytest-asyncio = ">=0.24"
pytest-cov     = ">=5"
respx          = "*"
ruff           = "*"
mypy           = "*"
pre-commit     = "*"

[tool.pixi.feature.docs.pypi-dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.6,<10"
mkdocstrings = { version = ">=1.0.4,<2", extras = ["python"] }
mkdocs-coverage = ">=2.0.0,<3"
pytest = ">=8"
pytest-cov = ">=5"
pytest-asyncio = ">=0.24"

[tool.basedpyright]
pythonVersion          = "3.11"
pythonPlatform         = "Windows"
venvPath               = ".pixi/envs"
venv                   = "dev"
typeCheckingMode       = "basic"
include                = ["trajcenter"]
exclude                = ["test.py", "tests/"]
useLibraryCodeForTypes = true
reportUnknownMemberType   = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs    = "warning"
reportAny                 = "none"
reportCallIssue           = "none"

[tool.pytest.ini_options]
asyncio_mode                       = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=trajcenter",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:docs/coverage",
    "--cov-report=xml:coverage.xml",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["trajcenter", "tests"]
branch = true
omit   = [".pixi/*", "*/site-packages/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "docs/coverage"
title     = "TrajCenter — Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
