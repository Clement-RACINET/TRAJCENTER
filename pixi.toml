[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]


# ==============================================================================
# Base editable package
# ==============================================================================
[pypi-dependencies]
trajcenter = { path = ".", editable = true }


# ==============================================================================
# Environments
# ==============================================================================
[environments]
# Minimal environment: conversion/export/store only.
default = { features = [], solve-group = "default" }

# Simple terminal menu environment.
tui = { features = ["tui"], solve-group = "default" }

# Robot/RWS environment.
robot = { features = ["robot"], solve-group = "default" }

# Runtime full environment: TUI + robot + optional Textual.
full = { features = ["tui", "textual", "robot"], solve-group = "default" }

# Development environment: everything needed to run tests, docs, robot, TUI.
dev = { features = ["dev", "docs", "tui", "textual", "robot"], solve-group = "default" }

# Documentation-only environment.
docs = { features = ["docs"], solve-group = "default" }


# ==============================================================================
# Base dependencies
# ==============================================================================
[dependencies]
python            = ">=3.12,<3.13"
pyarrow           = ">=24.0.0,<25"
pandas-stubs      = ">=3.0.3.260530,<4"
typing_extensions = ">=4.16.0,<5"
pytest = ">=9.1.1,<10"


# ==============================================================================
# TUI feature: simple maintainable terminal UI
# ==============================================================================
[feature.tui.pypi-dependencies]
rich = ">=15.0.0,<16"


# ==============================================================================
# Optional future Textual feature
# ==============================================================================
[feature.textual.pypi-dependencies]
textual = ">=8.2.8,<9"


# ==============================================================================
# Robot feature: ABB RWS communication
# ==============================================================================
[feature.robot.pypi-dependencies]
abb_rws_client_python_rw6 = { git = "https://gitlab.com/robothub/abb-rws-client-python-rw6.git", branch = "main" }


# ==============================================================================
# Development feature
# ==============================================================================
[feature.dev.tasks]
tests      = "pytest tests/"
lint       = "ruff check trajcenter/"
fmt        = "ruff format trajcenter/"
typecheck  = "mypy trajcenter/"

pyinit       = "pyinit"
pyinit-check = "pyinit --check"
pyinit-write = "pyinit --write"

pyclean = "pyclean"
clean-check = "pyclean --check"
clean-write = "pyclean --write"

pystructure = "pystructure"
structure = "pystructure tree --root ."
structure-export = "pystructure export --root ."
structure-export-all = "pystructure export --root . --formats all"

export-structure = "python utils/export_structure.py"
precommit-generate = { depends-on = ["pyinit-write", "export-structure"] }

[feature.dev.pypi-dependencies]
pytest         = ">=8"
pytest-asyncio = ">=0.24"
pytest-cov     = ">=5"
respx          = "*"
ruff           = "*"
mypy           = "*"
pre-commit     = "*"
py-init-tools = { git = "https://gitlab.com/dev-tools-cr/python/py-init-tools.git", branch = "main" }
py-clean-tools = { git = "https://gitlab.com/dev-tools-cr/python/py-clean-tools.git", branch = "main" }
py-structure-tools = { git = "https://gitlab.com/dev-tools-cr/python/py-structure-tools.git", branch = "main" }


# ==============================================================================
# Documentation feature
# ==============================================================================
[feature.docs.tasks]
docs       = "python scripts/doc/run_docs.py"
docs-build = "python -m mkdocs build --strict"
docs-serve = "python -m mkdocs serve"

[feature.docs.pypi-dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.6,<10"
mkdocstrings = { version = ">=1.0.4,<2", extras = ["python"] }
mkdocs-coverage = ">=2.0.0,<3"
pytest = ">=8"
pytest-cov = ">=5"
pytest-asyncio = ">=0.24"
