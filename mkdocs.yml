site_name: TrajCenter
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
  - coverage:
      html_report_dir: docs/coverage  # le rapport HTML

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]

nav:
  - Accueil: index.md
  - Référence API:
    # --- AUTOGEN_API_START ---
    - Trajcenter:
      - Converter:
        - Apt Converter: api/trajcenter/converter/apt_converter.md
        - Base: api/trajcenter/converter/base.md
        - Column Mapper: api/trajcenter/converter/column_mapper.md
        - Csv Converter: api/trajcenter/converter/csv_converter.md
        - Defaults: api/trajcenter/converter/defaults.md
        - Excel Converter: api/trajcenter/converter/excel_converter.md
        - Mod Converter: api/trajcenter/converter/mod_converter.md
        - Tabular Converter: api/trajcenter/converter/tabular_converter.md
      - Core:
        - Logger: api/trajcenter/core/logger.md
        - Messages: api/trajcenter/core/messages.md
        - Trajectory: api/trajcenter/core/trajectory.md
      - Exporter:
        - Base: api/trajcenter/exporter/base.md
        - Csv Exporter: api/trajcenter/exporter/csv_exporter.md
        - Excel Exporter: api/trajcenter/exporter/excel_exporter.md
        - Options: api/trajcenter/exporter/options.md
        - Tabular Exporter: api/trajcenter/exporter/tabular_exporter.md
      - Rws:
        - Utils: api/trajcenter/rws/_utils.md
        - Reader: api/trajcenter/rws/reader.md
        - Writer: api/trajcenter/rws/writer.md
# --- AUTOGEN_API_END ---
  - Coverage: coverage.md 

