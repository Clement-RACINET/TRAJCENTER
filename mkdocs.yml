site_name: TrajCenter
site_description: Documentation utilisateur et référence API de TrajCenter
site_author: Clément RACINET
copyright: "© 2026 Clément RACINET — TrajCenter"

docs_dir: docs/src
site_dir: docs/build/site

theme:
  name: readthedocs
  language: fr
  logo: assets/logo.png
  favicon: assets/favicon.png

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
  - sane_lists
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            docstring_section_style: list
            show_root_heading: true
            show_source: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Accueil: index.md

  - README: readme.md

  # - Exemples:
