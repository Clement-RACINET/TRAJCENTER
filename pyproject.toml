[project]
name = "trajcenter"
requires-python = ">=3.11"
version = "2.1.0"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pandas>=3.0.3,<4",
    "numpy>=2.5.1,<3",
    "pydantic>=2",
    "openpyxl>=3.1.5,<4",
    "rich>=15.0.0,<16",
    "typer>=0.26.8,<0.27",
    "textual>=8.2.8,<9",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.basedpyright]
pythonVersion          = "3.11"
pythonPlatform         = "Windows"
venvPath               = ".pixi/envs"
venv                   = "dev"
typeCheckingMode       = "basic"
include                = ["trajcenter"]
exclude                = ["test.py", "tests/"]
useLibraryCodeForTypes = true
reportUnknownMemberType   = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs    = "warning"
reportAny                 = "none"
reportCallIssue           = "none"

[tool.pytest.ini_options]
asyncio_mode                       = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=trajcenter",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:docs/coverage",
    "--cov-report=xml:coverage.xml",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["trajcenter", "tests"]
branch = true
omit   = [".pixi/*", "*/site-packages/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "docs/coverage"
title     = "TrajCenter — Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.py-init-tools]
package_roots = ["trajcenter"]
test_roots = ["tests"]

package_version = "2.1.0"
package_description = "TrajCenter v2 — trajectory management and RWS transfer for ABB robots."

generated_marker = "Generated by py-init-tools"

generate_root_reexports = true

reexport_allowlist = [
  "converter",
  "core",
  "exporter",
  "rws",
  "rws/errors",
]

discovery_mode = "all_public"
export_constants = true
export_type_aliases = true
flat_subdirs = []

[tool.py-structure-tools]
exclude_dirs = [
    "docs",
    "site",
    "outputs",
    "data",
    "sandbox",
]

exclude_files = [
    "*.log",
    "*.tmp",
    "*.bak",
    "*.csv",
    "*.parquet",
]

include_hidden = false
use_gitignore = true
max_depth = 5
default_formats = ["txt", "html"]
output_basename = "trajcenter_structure"
